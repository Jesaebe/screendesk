name: screendeck-home

services:
  dashboard:
    build:
      context: ./dashboard
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/Bahia}
      DASHBOARD_DATA_ROOT: /data
      BACKUP_STATUS_ROOT: /backup-status
      GOOGLE_CLIENT_SECRET_FILE: /run/secrets/google-client.json
      SMARTTHINGS_TOKEN_FILE: /run/secrets/smartthings-token
      DASHBOARD_PASSWORD_FILE: /run/secrets/dashboard-password
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME:-admin}
      DASHBOARD_PUBLIC_URL: ${DASHBOARD_PUBLIC_URL:-http://localhost:8123}
    ports:
      - "${DASHBOARD_PORT:-8123}:8080"
    volumes:
      - dashboard-data:/data
      - backup-status:/backup-status:ro
      - ./secrets/dashboard:/run/secrets:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  backup:
    build:
      context: ./backup
    user: "${BACKUP_UID:-1000}:${BACKUP_GID:-1000}"
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/Bahia}
      BACKUP_ROOT: /backups
      BACKUP_CONFIG: ${BACKUP_CONFIG:-/run/secrets/sources.toml}
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-0 2 * * *}
      BACKUP_LOCAL_HIGH_WATERMARK: ${BACKUP_LOCAL_HIGH_WATERMARK:-85}
      BACKUP_LOCAL_LOW_WATERMARK: ${BACKUP_LOCAL_LOW_WATERMARK:-75}
      BACKUP_CLOUD_RETENTION_DAYS: ${BACKUP_CLOUD_RETENTION_DAYS:-15}
      RCLONE_CONFIG: ${RCLONE_CONFIG:-/run/rclone/rclone.conf}
      BACKUP_CLOUD_REMOTE: ${BACKUP_CLOUD_REMOTE:-gdrive-crypt:screendeck-home}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD_FILE: ${SMTP_PASSWORD_FILE:-/run/secrets/smtp-password}
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
    volumes:
      - ${BACKUP_ROOT:-/srv/backups}:/backups
      - backup-status:/status
      - ${BACKUP_CONFIG_HOST:-./secrets/sources.toml}:/run/secrets/sources.toml:ro
      - ${BACKUP_MAKER_PASSWORD_HOST:-/home/cyrius/.config/screendeck-home/maker-password}:/run/secrets/maker-password:ro
      - ${SMTP_PASSWORD_HOST:-/home/cyrius/.config/screendeck-home/smtp-password}:/run/secrets/smtp-password:ro
      - ${RCLONE_CONFIG_DIR_HOST:-/home/cyrius/.config/rclone}:/run/rclone:rw
    networks:
      - internal
    healthcheck:
      test: ["CMD", "python3", "-m", "src.main", "healthcheck"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  internal:
    driver: bridge

volumes:
  backup-status:
  dashboard-data:
