title: ScreenDeck Home
views:
  - title: Início
    path: inicio
    icon: mdi:home
    cards:
      - type: markdown
        content: |
          # {{ now().strftime('%H:%M') }}
          {{ now().strftime('%A, %d/%m/%Y') }}
      - type: calendar
        title: Agenda
        initial_view: listWeek
        entities: []
      - type: entities
        title: Tarefas
        entities: []
      - type: entities
        title: Backup
        entities:
          - entity: sensor.screendeck_backup_status
          - entity: sensor.screendeck_backup_last_success
      - type: entities
        title: Ar-condicionado
        entities: []
      - type: markdown
        content: Métricas do servidor serão adicionadas após o inventário.
